name: PR 2067 review validation
on:
  push:
    branches: [work/pr-2067-remediation-20260906]
permissions:
  contents: write
concurrency:
  group: pr-2067-review-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version
          cargo --version
      - name: Prepare clean reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/pr2067/prepare.py
          git rev-parse HEAD | tee /tmp/pr2067-head.log
          git diff b82342ae4fa402e961feffa4dafb78cec0bd6c7d HEAD --check
          rustfmt --edition 2021 --config skip_children=true --check candle-binding/src/ffi/embedding.rs candle-binding/src/ffi/embedding_init_test.rs
      - name: Review repository gates
        shell: bash
        run: |
          set -euo pipefail
          for f in docs/agent/README.md docs/agent/repo-map.md docs/agent/environments.md docs/agent/change-surfaces.md; do
            echo "::group::$f"
            cat "$f"
            echo '::endgroup::'
          done
          grep -n -A18 -B3 '^test-binding-\(minimal\|lora\):' tools/make/*.mk Makefile || true
      - name: Focused initialization regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path candle-binding/Cargo.toml --no-default-features --lib embedding_init_order_regressions -- --nocapture 2>&1 | tee /tmp/pr2067-regressions.log
      - name: Binding minimal tests
        shell: bash
        run: |
          set -euo pipefail
          make test-binding-minimal 2>&1 | tee /tmp/pr2067-minimal.log
      - name: Binding LoRA tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          make test-binding-lora 2>&1 | tee /tmp/pr2067-lora.log
      - name: Retain validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2067-binding-validation-${{ github.sha }}
          path: /tmp/pr2067-*
          retention-days: 14
          if-no-files-found: warn
