name: PR 2067 review validation
on:
  push:
    branches: [work/pr-2067-remediation-20260906]
permissions:
  contents: write
concurrency:
  group: pr-2067-review-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PR2067_BASE: 8c76b723c723fd79163a6cca98f62d5af03fb722
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version
          cargo --version
      - name: Prepare clean reviewed candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/vllm-project/semantic-router.git "$PR2067_BASE"
          python3 tools/pr2067/prepare.py
          git rev-parse HEAD | tee /tmp/pr2067-head.log
          git diff "$PR2067_BASE" HEAD --check
          git diff "$PR2067_BASE" HEAD > /tmp/pr2067-remediation.patch
          rustfmt --edition 2021 --config skip_children=true --check candle-binding/src/ffi/embedding.rs candle-binding/src/ffi/embedding_init_test.rs
      - name: Review repository gates
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          for f in tools/agent/docs/README.md tools/agent/docs/repo-map.md tools/agent/docs/environments.md tools/agent/docs/change-surfaces.md; do
            echo "::group::$f"
            cat "$f"
            echo '::endgroup::'
          done
          make agent-report ENV=cpu CHANGED_FILES="candle-binding/src/ffi/embedding.rs candle-binding/src/ffi/embedding_init_test.rs tools/make/rust.mk" 2>&1 | tee /tmp/pr2067-agent-report.log
      - name: CPU Rust CI suite including initialization regressions
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          make test-rust-ci 2>&1 | tee /tmp/pr2067-regressions.log
      - name: Binding minimal tests
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          make test-binding-minimal 2>&1 | tee /tmp/pr2067-minimal.log
      - name: Binding LoRA tests (strict log outcome)
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          make test-binding-lora 2>&1 | tee /tmp/pr2067-lora.log
          if grep -Eq '^FAIL|^--- FAIL:|^[[:space:]]+--- FAIL:' /tmp/pr2067-lora.log; then
            echo '::error::LoRA target masked failing Go tests; inspect the retained log for missing-model prerequisites or regressions.'
            exit 1
          fi
      - name: Retain validation logs and candidate patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr2067-binding-validation-${{ github.sha }}
          path: /tmp/pr2067-*
          retention-days: 14
          if-no-files-found: warn
